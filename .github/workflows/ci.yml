name: Release gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alaga_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: alaga_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://alaga_test:ci-only-password@localhost:5432/alaga_test
      ALAGA_POSTGRES_TEST_URL: postgresql+asyncpg://alaga_test:ci-only-password@localhost:5432/alaga_test
      JWT_SECRET: ci-only-signing-secret-at-least-32-characters
      ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-characters
      GOOGLE_CLIENT_ID: ci-client
      GOOGLE_CLIENT_SECRET: ci-secret
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-lock.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: pip-audit -r requirements-lock.txt
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-landing/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
