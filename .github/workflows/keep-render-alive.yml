name: Keep Render Backend Alive

on:
  schedule:
    # Render free tier spins down after 15 minutes of inactivity.
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render /health endpoint
        env:
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL is not set. Add it in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          HEALTH_URL="${RENDER_BACKEND_URL%/}/health"
          echo "Pinging $HEALTH_URL ..."
          curl -fsS --retry 2 --retry-delay 5 --max-time 30 "$HEALTH_URL"
          echo ""
          echo "Render backend is healthy."
